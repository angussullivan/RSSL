name: Scheduled Email Reports

on:
  # Triggered externally by cron-job.org at 9pm and 9:15pm Sydney time.
  # GitHub's internal scheduler is not used — it silently skips on inactive repos.
  workflow_dispatch:
    inputs:
      type:
        description: 'Report to send'
        required: true
        default: 'daily'
        type: choice
        options:
          - reminder
          - daily
          - weekly
          - monthly

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: cd .github/scripts && npm install

      - name: Send scheduled emails
        run: cd .github/scripts && node send-emails.js
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          CRON_SCHEDULE:       ${{ github.event.schedule }}
          MANUAL_TYPE:         ${{ github.event.inputs.type }}
