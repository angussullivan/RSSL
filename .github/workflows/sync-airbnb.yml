name: Sync Airbnb Calendar

on:
  schedule:
    - cron: '0 21 * * *'   # 7am AEST (UTC+10) / 8am AEDT (UTC+11)
    - cron: '0 22 * * *'   # 8am AEST / 9am AEDT
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: cd .github/scripts && npm install

      - name: Sync Airbnb calendar
        run: cd .github/scripts && node sync-airbnb.js
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
