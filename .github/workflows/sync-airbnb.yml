name: Sync Airbnb Calendar

on:
  schedule:
    - cron: '0 19 * * *'   #  5am AEST (UTC+10) /  6am AEDT (UTC+11)
    - cron: '0  2 * * *'   # 12pm AEST           /  1pm AEDT
    - cron: '0  6 * * *'   #  4pm AEST           /  5pm AEDT
    - cron: '0 11 * * *'   #  9pm AEST           / 10pm AEDT
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: cd .github/scripts && npm install

      - name: Sync Airbnb calendar
        run: cd .github/scripts && node sync-airbnb.js
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
